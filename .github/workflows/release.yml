name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run test:release
      - name: Propose 0.x release and tag merged release PRs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/release.sh
# Owner approval is required for the scaffold migration.
# Subsequent release PRs can use GitHub auto-merge with required CI checks.
# A bot token is needed for release PRs to trigger additional Actions runs.
