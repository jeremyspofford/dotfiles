name: Preserve legacy snapshot
on:
  push:
    branches: ["feat/chezmoi-v0.0.1"]
    paths: [".github/workflows/preserve-legacy.yml"]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Create owner-requested annotated legacy tag without moving main
        uses: actions/github-script@v7
        with:
          script: |
            const expected = "3421071b3ddcbd0dd5ddc728df009af1ba8ca902";
            const {owner, repo} = context.repo;
            const ref = "tags/legacy/stow-2026";
            const main = await github.rest.repos.getBranch({owner, repo, branch: "main"});
            if (main.data.commit.sha !== expected) {
              throw new Error("Main moved since inventory; inspect it before preserving a snapshot.");
            }
            try {
              const found = await github.rest.git.getRef({owner, repo, ref});
              let target = found.data.object;
              if (target.type === "tag") {
                target = (await github.rest.git.getTag({owner, repo, tag_sha: target.sha})).data.object;
              }
              if (target.sha !== expected) throw new Error("Existing legacy tag differs; never move it.");
              core.info("Legacy tag already preserves the inventoried main.");
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tag = await github.rest.git.createTag({
              owner, repo, tag: "legacy/stow-2026", object: expected, type: "commit",
              message: "Preserve the owner-reviewed pre-v0.0.1 Workbench and Stow history."
            });
            await github.rest.git.createRef({owner, repo, ref: "refs/" + ref, sha: tag.data.sha});
            core.info("Created legacy/stow-2026 at " + expected + "; main is unchanged.");
