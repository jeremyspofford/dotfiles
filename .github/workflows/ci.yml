name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - run: apt-get update && apt-get install -y git python3 zsh shellcheck shfmt
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Plain shell content
        run: |
          shellcheck -e SC1090,SC1091 -s bash .aliases .bashrc .bash_profile .commonrc .config/dotfiles/*.zsh .config/dotfiles/aliases/*.zsh
          shfmt -ln bash -d .aliases .bashrc .bash_profile .commonrc .config/dotfiles/*.zsh .config/dotfiles/aliases/*.zsh
          python3 -m unittest discover -s tests -v
