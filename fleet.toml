# Plain content. Paths are relative to this checkout and the destination home.
format = "plain"
paths = ["agents/skills"]
overlays = ["core", "personal", "work", "client"]

[secrets.EXAMPLE_API_TOKEN]
reference = "op://Example/Development/api-token"
enabled = false

[groups.docker]
description = "Docker container shortcuts"
blocks = [".config/dotfiles/aliases/core.zsh"]

[groups.terraform]
description = "Terraform infrastructure shortcuts"
blocks = [".config/dotfiles/aliases/core.zsh"]

[groups.kubectl]
description = "Kubernetes command shortcuts"
blocks = [".config/dotfiles/aliases/core.zsh"]

[groups.python]
description = "Python interpreter shortcuts"
blocks = [".config/dotfiles/aliases/core.zsh"]

[groups.npm]
description = "Node package manager shortcuts"
blocks = [".config/dotfiles/aliases/core.zsh"]

[domains]
core = "Shared shell and Git settings, without extra domain commands."
personal = "Your own settings; examples personal_where and personal_list show your directory and its entries."
work = "Employer settings; examples work_where and work_list show your directory and its entries."
client = "Customer settings; examples client_where and client_list show your directory and its entries."

[groups.helpers]
description = "The fleet command alias for Fleet"
blocks = [".config/dotfiles/aliases/core.zsh"]
default = true
