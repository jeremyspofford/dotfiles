# Mirrors the existing Workbench prompt: identity, directory, branch, exit status.
# Disable git_status to avoid scanning large client trees on every prompt.
add_newline = false
format = "$username$hostname $directory$git_branch$line_break$character"

[username]
show_always = true
format = "[$user](cyan)"

[hostname]
ssh_only = false
format = "[@$hostname](cyan)"

[git_branch]
format = "[$branch](purple) "

[git_status]
disabled = true

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
