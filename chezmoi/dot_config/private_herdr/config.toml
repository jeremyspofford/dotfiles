onboarding = false
# Workbench: Herdr manages terminal sessions; repositories stay in ~/workspace.
[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
# Homebrew owns upgrades on this Mac.
version_check = false

[ui]
confirm_close = true

[experimental]
pane_history = false

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "herdr"

# Keybindings
# [keys]
# prefix = "ctrl+w"

