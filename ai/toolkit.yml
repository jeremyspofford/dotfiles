# AI toolkit manifest. Fields:
#   id, title, type (routine | prompt | command | skill), description, tags,
#   source (file, relative to this folder), public (bool),
#   public_source (optional sanitized file used for the website instead of source),
#   schedule (routines only, human-readable)
entries:
  - id: resume-monthly-review
    title: Monthly resume review
    type: routine
    schedule: 2nd of each month, 8:50 AM ET, on each work computer
    description: Reviews a month of commits, work logs, and Jira for resume-worthy work; logs sanitized evidence, updates the resume only when something clears the bar, and suggests blog posts and case studies.
    tags: [resume, career, git, automation]
    source: routines/resume-monthly-review.md
    public: true

  - id: timecard-summary
    title: Timecard summary
    type: routine
    schedule: Fridays and the last weekday of each month, 11:59 AM ET
    description: Turns a week of commits, Jira activity, and work-log notes into a per-client, day-by-day summary ready to paste into a timecard.
    tags: [timesheet, git, jira, automation]
    source: routines/timecard-summary.md
    public_source: routines/timecard-summary.public.md
    public: true

  - id: tailor-resume
    title: Tailor a resume to a job posting
    type: prompt
    description: Builds a role-specific resume from verified evidence only, using the posting's vocabulary where it honestly fits, plus a gap report rating every requirement strong, adjacent, or gap.
    tags: [resume, career, job-search]
    source: prompts/tailor-resume.md
    public: true

  - id: evidence-capture
    title: End-of-session evidence capture
    type: prompt
    description: At the end of a work session, separates what was actually completed from suggestions and unfinished work, and writes a sanitized entry for the resume evidence log.
    tags: [resume, career]
    source: prompts/evidence-capture.md
    public: true

  - id: jira
    title: Jira workflows (create, start, update)
    type: command
    description: Create issues with acceptance criteria, start a branch and move the ticket to In Progress, or update status and comments, via the Atlassian MCP.
    tags: [jira, git]
    source: ../claude-plugins/claude-engineering-plugin/agents/skills/jira/SKILL.md
    public: false   # client-specific site and project keys

  - id: timesheet
    title: Timesheet command
    type: command
    description: Weekly per-day accomplishment summary from Jira, commits, and open MRs.
    tags: [timesheet, jira, git]
    source: ../claude-plugins/claude-engineering-plugin/agents/skills/timesheet/SKILL.md
    public: false   # client-specific
